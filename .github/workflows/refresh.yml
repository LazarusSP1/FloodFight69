name: Refresh flood data
on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 min (off the :00 rush)
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Fetch feeds
        env:
          PREV_FEED: data/feed.json
          GEO_CACHE: data/geocache.json
          RADAR_DIR: data/radar
        run: |
          cp data/feed.json /tmp/prev.json
          PREV_FEED=/tmp/prev.json python fetch_feed.py data/feed.json
          python build_site.py
      - name: Commit
        run: |
          git config user.name "weather-fight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data index.html
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh $(date -u +%FT%TZ)"
          # main may have moved while we fetched (code pushes, another run):
          # rebase onto it, keeping this run's freshly generated data on conflict
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
